services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wolt_flask
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?Set FLASK_SECRET_KEY in .env}
      SMTP_EMAIL: ${SMTP_EMAIL:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      DB_NAME: company    
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - .:/app

  mysql:
    image: mysql:latest
    container_name: wolt_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: company
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: wolt_phpmyadmin
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:8080:80"

  arangodb:
    image: arangodb:latest
    container_name: wolt_arangodb
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_ROOT_PASSWORD:?Set ARANGO_ROOT_PASSWORD in .env}
    volumes:
      - arangodb_data:/var/lib/arangodb3
    ports:
      - "127.0.0.1:8529:8529"


  redis:
    image: redis:latest
    container_name: wolt_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  arangodb_data:
  redis_data:


